[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "article-submission-bot"
version = "0.1.0"
description = "Safe academic manuscript submission assistant with dry-run/draft defaults"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "João Pedro Pereira Passos", email = "joaopedro.passos@mail.uft.edu.br" },
]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "email-validator>=2.0",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "structlog>=24.1",
  "httpx>=0.27",
  "playwright>=1.40",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "PyMuPDF>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "anyio>=4.0",
]

[project.scripts]
article-bot = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
